name: partner
description: SGX Partners B2B mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  flutter_svg: ^2.0.0
  intl: ^0.20.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  mime: ^2.0.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0
  flutter_local_notifications: ^22.3.0
  google_fonts: ^8.2.1
  mobile_scanner: ^7.4.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/products/
    - assets/images/campaigns/
    - assets/images/payout_providers/
